[project]
name = "erinnerung"
version = "0.1.0"
description = "Persönlicher Erinnerungs-Bot: YAML rein, Telegram raus, nervt bis erledigt."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "croniter>=6.0",
    "watchfiles>=0.24",
    "python-dotenv>=1.0",
    "tzdata>=2024.2",
]

[project.scripts]
erinnerung = "erinnerung.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erinnerung"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
